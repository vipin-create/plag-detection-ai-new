{% extends 'base.html' %}

{% block title %}Writing Assistant - Coming Soon{% endblock %}

{% block content %}
<div class="coming-soon-container">
    <div class="particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="glass-box">
        <h2 class="sub-text">WRITING ASSISTANT v2.0</h2>
        <h1 class="glow-text">COMING <span class="soon">SOON</span></h1>
        
        <div class="divider"></div>
        
        <p class="description">
            Integrating <strong>Llama 3.3 Semantic Intelligence</strong> <br>
            for real-time grammar heatmaps and tone mapping.
        </p>

        <div class="progress-container">
            <div class="progress-bar-glow"></div>
        </div>
        
        <div class="badge-launch">
            <i class="bi bi-rocket-takeoff me-2"></i>ESTIMATED LAUNCH: Q4 2026
        </div>
    </div>
</div>

<style>
    /* 1. Full Screen Layout */
    .coming-soon-container {
        height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        background: transparent;
    }

    /* 2. The Glass Container */
    .glass-box {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 60px 80px;
        border-radius: 30px;
        text-align: center;
        z-index: 10;
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    /* 3. NEON GLOW TEXT ANIMATION */
    .glow-text {
        font-size: 5rem;
        font-weight: 900;
        color: #fff;
        letter-spacing: 10px;
        text-transform: uppercase;
        margin: 0;
        text-shadow: 0 0 10px #ffc107, 0 0 20px #ffc107, 0 0 40px #ffc107;
        animation: text-flicker 3s infinite;
    }

    .soon { color: #ffc107; }

    .sub-text {
        font-size: 1rem;
        letter-spacing: 5px;
        color: #94a3b8;
        margin-bottom: 10px;
    }

    /* 4. Description & Divider */
    .divider {
        height: 2px;
        width: 100px;
        background: #ffc107;
        margin: 30px auto;
        box-shadow: 0 0 15px #ffc107;
    }

    .description {
        color: #94a3b8;
        font-size: 1.1rem;
        line-height: 1.6;
    }

    /* 5. Pulsing Loading Bar */
    .progress-container {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        margin: 40px 0;
        overflow: hidden;
    }
    .progress-bar-glow {
        width: 40%;
        height: 100%;
        background: #ffc107;
        box-shadow: 0 0 20px #ffc107;
        animation: loading-slide 2s infinite ease-in-out;
    }

    /* 6. Animations */
    @keyframes text-flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; transform: scale(1.02); }
    }

    @keyframes loading-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
    }

    /* 7. Floating Particles */
    .particles span {
        position: absolute;
        width: 5px;
        height: 5px;
        background: #ffc107;
        border-radius: 50%;
        opacity: 0.3;
        animation: float 10s infinite linear;
    }
    
    @keyframes float {
        0% { transform: translateY(100vh) translateX(0); }
        100% { transform: translateY(-10vh) translateX(100px); }
    }

    /* Generating random positions for particles */
    .particles span:nth-child(1) { left: 10%; animation-duration: 8s; }
    .particles span:nth-child(2) { left: 30%; animation-duration: 12s; }
    .particles span:nth-child(3) { left: 50%; animation-duration: 7s; }
    .particles span:nth-child(4) { left: 70%; animation-duration: 15s; }
    .particles span:nth-child(5) { left: 90%; animation-duration: 9s; }

    .badge-launch {
        display: inline-block;
        border: 1px solid #ffc107;
        color: #ffc107;
        padding: 10px 25px;
        border-radius: 50px;
        font-weight: bold;
        transition: 0.3s;
    }
    .badge-launch:hover {
        background: #ffc107;
        color: #000;
        box-shadow: 0 0 20px #ffc107;
    }
</style>
{% endblock %}
