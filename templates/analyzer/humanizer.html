{% extends 'base.html' %}

{% block title %}AI Humanizer{% endblock %}

{% block content %}
<div class="container-fluid">
    <h3 class="fw-bold mb-4 text-primary">AI Text Humanizer</h3>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted">Paste your AI-generated text here:</label>
                            <textarea name="text_input" class="form-control" rows="15" placeholder="Paste AI text here..." style="border-radius: 10px; resize: none;" required>{{ original }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5">
                            <i class="bi bi-magic me-2"></i>Humanize Text
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card border-0 shadow-sm bg-white h-100">
                <div class="card-body p-4">
                    <label class="form-label text-muted fw-bold">Output (Human-like Text):</label>
                    <div class="p-3 border rounded-3 bg-light" style="min-height: 360px; font-family: 'Georgia', serif; line-height: 1.6;">
                        {% if humanized %}
                            {{ humanized|linebreaks }}
                        {% else %}
                            <p class="text-center text-muted mt-5 italic">Your humanized text will appear here...</p>
                        {% endif %}
                    </div>
                    {% if humanized %}
                    <button class="btn btn-outline-secondary mt-3 w-100 rounded-pill" onclick="navigator.clipboard.writeText('{{ humanized|escapejs }}')">
                        <i class="bi bi-clipboard me-2"></i>Copy to Clipboard
                    </button>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
