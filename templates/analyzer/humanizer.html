{% extends 'base.html' %}

{% block title %}Humanizer AI{% endblock %}

{% block content %}
<div class="container-fluid">
    <h3 class="fw-bold mb-4" style="color: #8B5CF6;">Humanizer AI</h3>
    
    {% if not show_result %}
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="POST" action="{% url 'humanizer' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted">Paste robotic text to rewrite it naturally:</label>
                    <textarea name="text_to_humanize" class="form-control" rows="10" placeholder="Paste AI text here..." style="border-radius: 10px;" required></textarea>
                </div>
                <button type="submit" class="btn text-white btn-lg rounded-pill px-5" style="background-color: #8B5CF6;">
                    <i class="bi bi-stars me-2"></i>Humanize Text
                </button>
            </form>
        </div>
    </div>
    
    {% else %}
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100 border-0">
                <div class="card-header bg-white fw-bold">Original Text</div>
                <div class="card-body bg-light">
                    {{ original|linebreaks }}
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-header text-white fw-bold" style="background-color: #8B5CF6;">Humanized Version</div>
                <div class="card-body bg-white">
                    {{ humanized|linebreaks }}
                </div>
                <div class="card-footer bg-white border-0">
                    <a href="{% url 'humanizer' %}" class="btn btn-outline-secondary btn-sm">Humanize Another</a>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
